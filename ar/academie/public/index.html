<style>
  :root{
    --creme:#FBF3E4; --marine:#4A3626; --marine-2:#6B5240; --marine-soft:#F3E4C7;
    --rouge:#C1573A; --rouge-dark:#9C4530; --butter:#E3A857; --grey:#8F7D68; --sauge:#6B7A54;
    --shadow:0 10px 26px rgba(62,42,30,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--creme); color:var(--marine); font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}

  header{position:sticky; top:0; z-index:20; background:rgba(255,248,239,0.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(62,42,30,0.08);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:0.9rem;}
  .brand img{height:28px;}
  .brand b{font-family:'Anton',sans-serif;}
  .brand .tag{font-size:0.66rem; background:rgba(201,122,61,0.14); color:var(--rouge-dark); padding:3px 8px; border-radius:5px; margin-inline-start:4px; font-weight:700;}
  .nav-actions{display:flex; align-items:center; gap:10px; font-size:0.82rem;}
  .nav-actions a{padding:8px 14px; border-radius:100px; border:1px solid var(--marine);}
  .nav-actions a:hover{background:var(--marine); color:#fff;}
  .nav-actions .pro-link{background:var(--marine); color:#fff; border:none; font-weight:700; display:flex; align-items:center; gap:6px;}

  .lang-toggle{display:flex; align-items:center; background:var(--marine-soft); border-radius:100px; padding:3px; gap:2px;}
  .lang-btn{padding:7px 12px; border-radius:100px; font-weight:700; font-size:0.76rem; color:var(--marine-2); transition:all 0.18s ease;}
  .lang-btn.active{background:var(--marine); color:#fff;}

  .hero{padding:44px 0 26px; text-align:center;}
  .kicker{display:inline-block; font-size:0.8rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--rouge-dark); margin-bottom:12px;}
  h1{font-family:'Anton',sans-serif; font-size:clamp(1.7rem,4vw,2.4rem); text-transform:uppercase; margin:0 0 10px;}
  h1 .script{display:block; font-family:'Kaushan Script',cursive; text-transform:none; font-size:0.6em; color:var(--rouge); margin-top:3px;}
  .hero p{max-width:520px; margin:0 auto; color:var(--marine-2); line-height:1.55; font-size:0.94rem;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; padding:8px 0 70px;}
  .rcard{display:block; background:#fff; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform 0.18s ease; border:1px solid rgba(62,42,30,0.06);}
  .rcard:hover{transform:translateY(-3px);}
  .marquee{margin-top:26px; display:flex; flex-direction:column; gap:10px; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
  .marquee-row{display:flex; gap:10px; width:max-content; animation:slide 60s linear infinite;}
  .marquee-row.reverse{animation-duration:75s; animation-direction:reverse;}
  .marquee:hover .marquee-row{animation-play-state:paused;}
  .marquee img{width:130px; height:88px; object-fit:cover; border-radius:12px; flex:none; display:block;}
  @keyframes slide{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  @media (max-width:480px){ .marquee img{width:104px; height:72px;} .marquee-row{animation-duration:45s;} }
  @media (prefers-reduced-motion: reduce){ .marquee-row{animation:none;} .marquee{overflow-x:auto;} }

  .rcard-visual{height:110px; display:flex; align-items:center; justify-content:center; background:var(--marine-soft); position:relative; overflow:hidden;}
  .rcard-visual.has-img{height:135px; background:#EDE6D8;}
  .rcard-visual img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease;}
  .rcard-visual .rcard-fallback{display:none;}
  .rcard-visual.no-img .rcard-fallback{display:flex; align-items:center; justify-content:center;}
  .rcard-visual.no-img{background:var(--marine-soft);}
  .rcard-visual.no-img svg{width:38px; height:38px;}
  .rcard:hover .rcard-visual img{transform:scale(1.06);}
  .rcard{transition:transform .25s ease, box-shadow .25s ease;}
  .rcard:hover{transform:translateY(-4px); box-shadow:0 10px 24px rgba(58,46,26,0.13);}
  .reveal{opacity:0; transform:translateY(14px); animation:revealIn .5s ease forwards;}
  @keyframes revealIn{to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .reveal{animation:none; opacity:1; transform:none;}
    .rcard:hover{transform:none;}
    .rcard:hover .rcard-visual img{transform:none;}
  }
  .rcard-visual svg{width:46px; height:46px;}
  .rcard-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px;}
  .rcard-title{font-weight:700; font-size:0.98rem;}
  .rcard-meta{font-size:0.74rem; color:var(--grey); display:flex; gap:8px;}
  .rcard-meta span{background:var(--marine-soft); padding:4px 9px; border-radius:100px;}
  .rcard-play{font-size:0.82rem; font-weight:700; color:var(--rouge-dark); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .rcard-play svg{width:12px; height:12px;}

  /* ---------- Vue complète (recette figée) ---------- */
  .fullview-overlay{position:fixed; inset:0; background:var(--creme); z-index:110; display:none; overflow-y:auto;}
  .fullview-overlay.open{display:block;}
  .fullview-panel{max-width:640px; margin:0 auto; padding:0 0 60px;}
  .fullview-top{position:sticky; top:0; background:var(--creme); padding:16px 20px; border-bottom:1px solid rgba(62,42,30,0.08); z-index:2;}
  .fullview-back{display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.86rem; color:var(--marine);}
  .fullview-back svg{width:18px; height:18px;}
  .fv-title{font-family:'Anton',sans-serif; font-size:1.6rem; text-transform:uppercase; line-height:1.15; margin:20px 20px 6px;}
  .fv-hook{color:var(--marine-2); font-size:0.92rem; margin:0 20px 14px; line-height:1.5;}
  .fv-meta{display:flex; gap:8px; margin:0 20px 22px;}
  .fv-meta span{background:var(--marine-soft); padding:5px 12px; border-radius:100px; font-size:0.78rem; color:var(--marine-2);}
  .fv-section-label{font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark); margin:26px 20px 10px;}
  .fv-ing-list{list-style:none; margin:0 20px; padding:0; display:flex; flex-direction:column; gap:0;}
  .fv-ing-list li{display:flex; justify-content:space-between; font-size:0.92rem; padding:10px 0; border-bottom:1px dashed rgba(62,42,30,0.14);}
  .fv-ing-list b{color:var(--rouge-dark); font-weight:700;}
  .fv-steps{list-style:none; margin:0 20px; padding:0; display:flex; flex-direction:column; gap:16px; counter-reset:fvstep;}
  .fv-step{display:flex; gap:12px;}
  .fv-step-num{flex:none; width:28px; height:28px; border-radius:50%; background:var(--rouge); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:0.85rem;}
  .fv-step-text{font-size:0.95rem; line-height:1.55; color:var(--marine); padding-top:3px;}
  .fv-note{margin:0 20px 16px 60px; border-radius:12px; padding:12px 14px; font-size:0.85rem; line-height:1.5;}
  .fv-note.tip{background:var(--marine-soft); color:var(--marine-2);}
  .fv-note.swap{background:#FBEFE0; border:1px dashed var(--rouge); color:var(--marine-2);}
  .fv-note.number{background:var(--rouge); color:#fff;}
  .fv-note.number b{display:block; font-family:'Anton',sans-serif; font-size:1.15rem; margin-bottom:2px;}
  .fv-shop{margin:26px 20px 0; padding:18px 20px; border-radius:16px; background:linear-gradient(135deg,#FBF6E9,#F6EBCF); border:1px solid rgba(212,160,23,0.4);}
  .fv-shop-txt strong{display:block; font-size:0.95rem; color:#3A2E1A; margin-bottom:5px;}
  .fv-shop-txt span{display:block; font-size:0.84rem; line-height:1.5; color:var(--marine-2); margin-bottom:14px;}
  .fv-shop-btn{display:inline-flex; align-items:center; gap:8px; background:#D4A017; color:#fff; font-weight:700; font-size:0.85rem; padding:11px 20px; border-radius:100px;}
  .fv-shop-btn svg{width:15px; height:15px;}
  html[dir="rtl"] .fv-shop-btn svg{transform:scaleX(-1);}
  .fv-share-btn{display:flex; align-items:center; justify-content:center; gap:9px; margin:30px 20px 0; width:calc(100% - 40px); padding:14px; border-radius:100px; background:var(--rouge); color:#fff; font-weight:700; font-size:0.88rem; border:none; cursor:pointer; transition:filter .2s;}
  .fv-share-btn:hover{filter:brightness(1.08);}
  .fv-share-btn svg{width:16px; height:16px;}
  .fv-note-label{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:4px; opacity:0.85;}
  @media (max-width:480px){ .fullview-panel{padding-bottom:40px;} }
  html[dir="rtl"] .fv-note{margin:0 60px 16px 20px;}
  html[dir="rtl"] .fullview-back svg{transform:scaleX(-1);} to{opacity:1; transform:translateY(0);} }

  .cap-label{font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark);}
  .cap-label.tip{color:var(--sauge);}
  .cap-label.swap{color:var(--rouge-dark);}
  .cap-title{font-family:'Anton',sans-serif; font-size:1.35rem; text-transform:uppercase; line-height:1.15;}
  .cap-hook{color:var(--marine-2); font-size:0.88rem; line-height:1.5; max-width:280px;}
  .cap-num-badge{width:32px; height:32px; border-radius:50%; background:var(--rouge); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:0.9rem;}
  .cap-text{font-size:1.12rem; line-height:1.5; font-weight:500; max-width:290px; color:var(--marine);}
  .cap-tipbox{background:var(--marine-soft); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-swapbox{background:#FBEFE0; border:1px dashed var(--rouge); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-number{font-family:'Anton',sans-serif; font-size:2.3rem; color:var(--rouge-dark); line-height:1;}
  .cap-number-label{font-size:0.82rem; color:var(--marine-2);}
  .ing-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-width:280px; width:100%;}
  .ing-list li{display:flex; justify-content:space-between; font-size:0.86rem; padding-bottom:7px; border-bottom:1px dashed rgba(62,42,30,0.14);}
  .ing-list b{color:var(--rouge-dark);}

  .section-tabs{display:flex; gap:8px; margin:0 0 14px; overflow-x:auto;}
  .section-tab{padding:9px 16px; border-radius:100px; background:var(--marine-soft); color:var(--marine-2); font-weight:700; font-size:0.82rem; white-space:nowrap;}
  .section-tab.active{background:var(--marine); color:#fff;}
  .niveau-tabs{display:flex; gap:8px; margin:0 0 20px;}
  .niveau-tab{padding:8px 14px; border-radius:100px; background:transparent; border:1.5px solid var(--rouge); color:var(--rouge-dark); font-weight:700; font-size:0.78rem;}
  .niveau-tab.active{background:var(--rouge); color:#fff;}
  .materiel-block{padding:6px 2px 30px;}
  .materiel-title{font-family:'Anton',sans-serif; font-size:1.4rem; text-transform:uppercase; margin-bottom:6px;}
  .materiel-intro{color:var(--marine-2); font-size:0.9rem; margin-bottom:20px; max-width:520px;}
  .materiel-label{font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark); margin:22px 0 10px;}
  .materiel-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .materiel-list li{background:var(--marine-soft); border-radius:12px; padding:12px 16px;}
  .materiel-list b{display:block; font-size:0.92rem; margin-bottom:3px;}
  .materiel-list span{font-size:0.82rem; color:var(--marine-2); line-height:1.4;}
  .materiel-outro{margin-top:24px; font-size:0.86rem; color:var(--marine-2);}
  .niveau-tab-pro{border-color:var(--or,#D4A017); color:#8A6A0F;}
  .niveau-tab-pro.active{background:var(--or,#D4A017); color:#fff; border-color:var(--or,#D4A017);}
  .pro-intro{grid-column:1/-1; background:linear-gradient(135deg,#FBF6E9,#F6EBCF); border:1px solid rgba(212,160,23,0.4); border-radius:16px; padding:20px 22px; margin-bottom:6px;}
  .pro-intro h3{font-family:'Anton',sans-serif; font-size:1.15rem; text-transform:uppercase; margin:0 0 8px; color:#3A2E1A;}
  .pro-intro p{font-size:0.88rem; line-height:1.55; color:var(--marine-2); margin:0 0 14px;}
  .pro-cta{display:inline-flex; align-items:center; gap:8px; background:#D4A017; color:#fff; font-weight:700; font-size:0.86rem; padding:11px 20px; border-radius:100px;}
  .pro-cta svg{width:15px; height:15px;}
  .rcard-pro{border:1.5px solid rgba(212,160,23,0.5); position:relative;}
  .rcard-pro .rcard-visual{background:#FBF6E9 !important;}
  .pro-badge{position:absolute; top:8px; inset-inline-end:8px; background:#D4A017; color:#fff; font-size:0.62rem; font-weight:700; letter-spacing:0.06em; padding:3px 8px; border-radius:100px;}
  .pro-note{grid-column:1/-1; font-size:0.78rem; color:var(--marine-2); text-align:center; margin-top:8px;}
  html[dir="rtl"] .pro-cta svg{transform:scaleX(-1);}

  .pro-transition-overlay{position:fixed; inset:0; background:rgba(58,46,26,0.55); backdrop-filter:blur(2px); z-index:120; display:none; align-items:center; justify-content:center; padding:24px;}
  .pro-transition-overlay.open{display:flex;}
  .pro-transition-card{background:#fff; border-radius:20px; max-width:360px; width:100%; padding:28px 26px 24px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.25); animation:ptIn .22s ease;}
  @keyframes ptIn{from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;}}
  .pt-icon{width:52px; height:52px; border-radius:50%; background:#FBF6E9; border:1.5px solid rgba(212,160,23,0.4); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .pt-icon svg{width:26px; height:26px;}
  .pro-transition-card h3{font-family:'Anton',sans-serif; font-size:1.15rem; text-transform:uppercase; margin:0 0 10px; color:var(--marine);}
  .pro-transition-card p{font-size:0.87rem; line-height:1.55; color:var(--marine-2); margin:0 0 22px;}
  .pt-actions{display:flex; flex-direction:column; gap:9px;}
  .pt-btn-primary{display:flex; align-items:center; justify-content:center; gap:8px; background:#D4A017; color:#fff; font-weight:700; font-size:0.88rem; padding:13px; border-radius:100px; text-decoration:none;}
  .pt-btn-primary svg{width:15px; height:15px;}
  .pt-btn-secondary{background:none; border:none; color:var(--marine-2); font-size:0.83rem; font-weight:600; padding:8px; cursor:pointer;}
  html[dir="rtl"] .pt-btn-primary svg{transform:scaleX(-1);}

  /* ---------- Impression : ne garder que la fiche recette ---------- */
  @media print{
    header, .hero, .marquee, .searchbar, .section-tabs, .niveau-tabs,
    .grid, footer, .lang-toggle, .fv-share-btn, .fv-shop, .fullview-top{ display:none !important; }
    body{ background:#fff !important; color:#000; }
    .fullview-overlay{ position:static !important; display:block !important; overflow:visible !important; background:#fff !important; }
    .fullview-panel{ max-width:100% !important; padding:0 !important; }
    .fv-title{ font-size:20pt; margin:0 0 6pt; }
    .fv-meta span{ background:none !important; border:1px solid #999; color:#000 !important; }
    .fv-section-label{ color:#000 !important; margin:14pt 0 6pt; }
    .fv-ing-list li{ font-size:10.5pt; padding:4pt 0; }
    .fv-step-num{ background:#000 !important; color:#fff !important; }
    .fv-step-text{ font-size:10.5pt; }
    .fv-note{ border:1px solid #999 !important; background:none !important; color:#000 !important; }
    .fv-note.number b{ color:#000 !important; }
    .fv-step{ page-break-inside:avoid; }
    /* rappel de la source sur le papier */
    .fullview-panel::after{ content:"4cake.ma — Académie 4Cake"; display:block; margin-top:18pt; padding-top:8pt; border-top:1px solid #999; font-size:9pt; color:#555; }
  }

  .searchbar{position:relative; margin:0 0 14px;}
  .searchbar input{width:100%; padding:13px 42px 13px 42px; border-radius:100px; border:1.5px solid rgba(62,42,30,0.14); background:#fff; font-family:inherit; font-size:0.92rem; color:var(--marine); outline:none; transition:border-color .2s, box-shadow .2s;}
  .searchbar input:focus{border-color:var(--rouge); box-shadow:0 0 0 3px rgba(193,87,58,0.12);}
  .searchbar input::-webkit-search-cancel-button{display:none;}
  .search-icon{position:absolute; inset-inline-start:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--marine-2); pointer-events:none;}
  .search-clear{position:absolute; inset-inline-end:12px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; background:var(--marine-soft); color:var(--marine-2); display:none; align-items:center; justify-content:center;}
  .search-clear svg{width:12px; height:12px;}
  .searchbar.filled .search-clear{display:flex;}
  .search-count{grid-column:1/-1; font-size:0.82rem; color:var(--marine-2); margin:0 2px 4px;}
  .search-empty{grid-column:1/-1; text-align:center; padding:34px 20px; color:var(--marine-2);}
  .search-empty strong{display:block; font-size:1rem; color:var(--marine); margin-bottom:6px;}
  .search-cat{grid-column:1/-1; font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark); margin:10px 2px 2px;}

  .bases-group-label{grid-column:1/-1; font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark); margin:6px 2px 2px;}
  .bases-group-label.bases-group-maroc{margin-top:18px;}

/* ============ Suivi GTM / GA4 (dataLayer) ============ */
window.dataLayer = window.dataLayer || [];
function dlPush(event, params){
  try{ window.dataLayer.push(Object.assign({event: event, espace: 'public'}, params || {})); }
  catch(e){ /* le suivi ne doit jamais casser le site */ }
}

let currentLang = 'ar'; // forcé selon la page réelle, indépendant du localStorage
let activeSection = 'recettes';
let activeNiveau = 1;

function r(recipe){ return recipe[currentLang]; }

function cardHTML(rec){
  const d = r(rec);
  const img = RECIPE_IMG[rec.id];
  const visual = img
    ? `<img src="${IMG_BASE}${img}" alt="${d.title}" loading="lazy" decoding="async"
         onerror="this.parentNode.classList.add('no-img');this.remove();">
       <span class="rcard-fallback">${ICONS[rec.icon]}</span>`

  // on ne pose un href crawlable que quand la cible existe réellement, pour ne jamais créer
  // de lien interne cassé.

  const tag = hasStaticPage ? 'a' : 'div';
  const hrefAttr = hasStaticPage ? `href="/fr/academie/public/recette/${rec.id}.html"` : '';
  const clickAttr = `onclick="openRecipe('${rec.id}');return false;"`;
  return `
    <${tag} class="rcard reveal" ${hrefAttr} ${clickAttr}>

      </div>
    </${tag}>
  `;
}

/* ============ Recherche ============ */
let searchQuery = '';

// insensible à la casse, aux accents et aux tirets — fonctionne aussi en arabe
function normalize(s){
  return (s || '').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\u0640]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\u0600-\u06ff]+/g, ' ')
    .trim();
}

let searchTimer = null;
function onSearch(v){
  searchQuery = v;
  clearTimeout(searchTimer);
  if(v.trim().length >= 3){
    searchTimer = setTimeout(() => {
      const q = normalize(v);
      const n = RECIPES.filter(x => matchesSearch(x, q)).length + BASICS.filter(x => matchesSearch(x, q)).length;
      dlPush('recherche', { terme: v.trim().toLowerCase(), resultats: n, langue: currentLang });
    }, 1200); // on attend la fin de la frappe
  }
  document.querySelector('.searchbar').classList.toggle('filled', v.trim().length > 0);
  renderGrid();
}
function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.querySelector('.searchbar').classList.remove('filled');
  renderGrid();
  if(input) input.focus();
}

// Cherche dans le titre et les ingrédients, dans les DEUX langues :
// un utilisateur en mode arabe peut ainsi retrouver une recette dont il connaît le nom français, et inversement.
function matchesSearch(item, q){
  for(const lang of ['fr','ar']){
    const d = item[lang];
    if(!d) continue;
    if(normalize(d.title).indexOf(q) > -1) return true;
    if(d.ingredients && d.ingredients.some(([nom]) => normalize(nom).indexOf(q) > -1)) return true;
  }
  return false;
}

function renderSearchResults(){
  const grid = document.getElementById('grid');
  const t = UI[currentLang];
  const q = normalize(searchQuery);

  const recettes = RECIPES.filter(x => matchesSearch(x, q));
  const bases    = BASICS.filter(x => matchesSearch(x, q));
  const total    = recettes.length + bases.length;

  if(total === 0){
    grid.innerHTML = `<div class="search-empty"><strong>${t.search_vide}</strong>${t.search_vide_aide}</div>`;
    return;
  }

  let html = `<div class="search-count">${total} ${total > 1 ? t.search_resultats : t.search_resultat}</div>`;
  const clas = recettes.filter(x => x.cat === 'classique');
  const maro = recettes.filter(x => x.cat === 'marocain');
  if(clas.length) html += `<div class="search-cat">${t.tab_recettes}</div>` + clas.map(cardHTML).join('');
  if(maro.length) html += `<div class="search-cat">${t.tab_marocain}</div>` + maro.map(cardHTML).join('');
  if(bases.length) html += `<div class="search-cat">${t.tab_bases}</div>` + bases.map(cardHTML).join('');
  grid.innerHTML = html;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const materielBlock = document.getElementById('materielBlock');
  const niveauTabs = document.getElementById('niveauTabs');

  document.querySelectorAll('.section-tab').forEach(b => b.classList.toggle('active', b.dataset.section === activeSection));
  // le libellé étant injecté ici, on renseigne aussi l'étiquette d'accessibilité
  const majTab = (sel, txt) => {
    const el = document.getElementById('sectionTabs').querySelector(sel);
    if(el){ el.textContent = txt; el.setAttribute('aria-label', txt); }
  };
  majTab('[data-section="recettes"]', UI[currentLang].tab_recettes);
  majTab('[data-section="marocain"]', UI[currentLang].tab_marocain);
  majTab('[data-section="bases"]', UI[currentLang].tab_bases);
  majTab('[data-section="materiel"]', UI[currentLang].tab_materiel);
  [1,2,3].forEach(n => {
    const el = niveauTabs.querySelector('[data-niveau="' + n + '"]');
    const txt = UI[currentLang]['niveau' + n];
    if(el){ el.textContent = txt; el.setAttribute('aria-label', txt); }
  });
  document.querySelectorAll('.niveau-tab').forEach(b => b.classList.toggle('active', Number(b.dataset.niveau) === activeNiveau));

  // Une recherche active masque les onglets et affiche les résultats transversaux
  if(searchQuery.trim().length > 0){
    materielBlock.style.display = 'none';
    niveauTabs.style.display = 'none';
    grid.style.display = 'grid';
    renderSearchResults();
    return;
  }

  if(activeSection === 'materiel'){
    grid.style.display = 'none';
    niveauTabs.style.display = 'none';
    materielBlock.style.display = 'block';
    renderMateriel();
    return;
  }
  materielBlock.style.display = 'none';
  grid.style.display = 'grid';

  if(activeSection === 'bases'){
    niveauTabs.style.display = 'none';
    const general = BASICS.filter(b => b.groupe === 'general');
    const marocain = BASICS.filter(b => b.groupe === 'marocain');
    grid.innerHTML = `
      <div class="bases-group-label">${UI[currentLang].bases_general}</div>
      ${general.map(cardHTML).join('')}
      <div class="bases-group-label bases-group-maroc">${UI[currentLang].bases_marocain}</div>
      ${marocain.map(cardHTML).join('')}
    `;
    return;
  }

  niveauTabs.style.display = 'flex';
  const cat = activeSection === 'marocain' ? 'marocain' : 'classique';

  if(activeNiveau === 3){
    const t = UI[currentLang];
    grid.innerHTML = `
      <div class="pro-intro">
        <h3>${t.pro_titre}</h3>
        <p>${t.pro_texte}</p>
        <a class="pro-cta" href="${PRO_URL}">
          ${t.pro_cta}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      ${PRO_TEASER.map(p => `
        <a class="rcard rcard-pro" href="${PRO_URL}">
          <span class="pro-badge">${t.pro_badge}</span>
          <div class="rcard-visual">${ICONS[p.icon]}</div>
          <div class="rcard-body">
            <div class="rcard-title">${p[currentLang]}</div>
          </div>
        </a>`).join('')}
      <div class="pro-note">${t.pro_note}</div>
    `;
    return;
  }

  grid.innerHTML = RECIPES.filter(rec => rec.cat === cat && rec.niveau === activeNiveau).map(cardHTML).join('');
}

function renderMateriel(){
  const m = MATERIEL[currentLang];
  const rowsHTML = rows => rows.map(([a,b]) => `<li><b>${a}</b><span>${b}</span></li>`).join('');
  document.getElementById('materielBlock').innerHTML = `
    <div class="materiel-title">${m.title}</div>
    <div class="materiel-intro">${m.intro}</div>
    <div class="materiel-label">${m.essentiel_label}</div>
    <ul class="materiel-list">${rowsHTML(m.essentiel)}</ul>
    <div class="materiel-label">${m.optionnel_label}</div>
    <ul class="materiel-list">${rowsHTML(m.optionnel)}</ul>
    <div class="materiel-outro">${m.outro}</div>
  `;
}

function switchSection(section){
  if(section !== activeSection) dlPush('section_vue', { section: section });
  activeSection = section;
  renderGrid();
}
function switchNiveau(n){
  if(n !== activeNiveau){
    dlPush('niveau_change', { niveau: n, section: activeSection });
    if(n === 3) dlPush('vitrine_pro_vue', { section: activeSection });
  }
  activeNiveau = n;
  renderGrid();
}

let curRecipe = null;
const CAP_DURATION = 4500;



/* ============ Données structurées Recipe (SEO) ============
   Injectées à l'ouverture d'une fiche, retirées à la fermeture :
   Google lit ainsi la recette réellement consultée. */
function setRecipeSchema(item){
  const old = document.getElementById('recipeSchema');
  if(old) old.remove();
  if(!item || !RECIPES.some(x => x.id === item.id)) return; // uniquement les recettes

  const d = item[currentLang] || item.fr;
  const etapes = d.capsules
    .filter(cp => cp.type === 'step')
    .map((cp, i) => ({ "@type": "HowToStep", "position": i + 1, "text": cp.text }));

  const data = {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": d.title,
    "inLanguage": currentLang === 'ar' ? 'ar' : 'fr',
    "recipeCategory": "Dessert",
    "recipeCuisine": item.cat === 'marocain' ? (currentLang === 'ar' ? 'مغربية' : 'Marocaine') : (currentLang === 'ar' ? 'فرنسية' : 'Française'),
    "author": { "@type": "Organization", "name": "4Cake Académie", "url": "https://www.4cake.ma/" },
    "publisher": { "@type": "Organization", "name": "4Cake", "url": "https://www.4cake.ma/" }
  };

  const hook = (d.capsules.find(cp => cp.type === 'title') || {}).hook;
  if(hook) data.description = hook;
  if(d.time) data.totalTime = d.time;                 // texte lisible, non ISO 8601
  if(d.ingredients) data.recipeIngredient = d.ingredients.map(([n, q]) => (q ? q + ' ' + n : n));
  if(etapes.length) data.recipeInstructions = etapes;
  if(RECIPE_IMG[item.id]) data.image = 'https://www.4cake.ma/Academie/public/' + IMG_BASE + RECIPE_IMG[item.id];

  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.id = 'recipeSchema';
  s.textContent = JSON.stringify(data);
  document.head.appendChild(s);
}

function openFullView(){
  const d = r(curRecipe);
  const t = UI[currentLang];
  let ingHTML = '';
  if(d.ingredients){
    ingHTML = `
      <div class="fv-section-label">${t.ingredients}</div>
      <ul class="fv-ing-list">${d.ingredients.map(([n,q]) => `<li><span>${n}</span><b>${q}</b></li>`).join('')}</ul>`;
  }
  let stepIdx = 0;
  let flowHTML = '';
  let openList = false;
  d.capsules.forEach(c => {
    if(c.type === 'title' || c.type === 'ing') return;
    if(c.type === 'step'){
      if(!openList){ flowHTML += '<ul class="fv-steps">'; openList = true; }
      stepIdx++;
      flowHTML += `<li class="fv-step"><div class="fv-step-num">${stepIdx}</div><div class="fv-step-text">${c.text}</div></li>`;
      return;
    }
    if(openList){ flowHTML += '</ul>'; openList = false; }
    if(c.type === 'number') flowHTML += `<div class="fv-note number"><div class="fv-note-label">${t.repere}</div><b>${c.value}</b>${c.label}</div>`;
    if(c.type === 'tip') flowHTML += `<div class="fv-note tip"><div class="fv-note-label">${t.astuce}</div>${c.text}</div>`;
    if(c.type === 'swap') flowHTML += `<div class="fv-note swap"><div class="fv-note-label">${t.equivalent}</div>${c.text}</div>`;
  });
  if(openList) flowHTML += '</ul>';
  document.getElementById('fullviewBackLabel').textContent = t.retour;
  document.getElementById('fullviewBody').innerHTML = `
    <div class="fv-title">${d.title}</div>
    ${d.time || d.level ? `<div class="fv-meta">${d.time ? `<span>⏱ ${d.time}</span>`:''}${d.level ? `<span>${d.level}</span>`:''}</div>` : ''}
    ${ingHTML}
    <div class="fv-section-label">${t.methode}</div>
    ${flowHTML}
    <button class="fv-share-btn" onclick="partagerRecette()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M8 7l4-4 4 4"/></svg>
      ${t.partager}
    </button>
    ${encartCatalogue(curRecipe)}
  `;
  setRecipeSchema(curRecipe);
  document.getElementById('fullviewOverlay').classList.add('open');
}
function closeFullView(silencieux){
  setRecipeSchema(null);
  document.getElementById('fullviewOverlay').classList.remove('open');
  if(!silencieux && location.hash) history.pushState({}, '', location.pathname + location.search);
}

// Entrée par défaut : la fiche figée
// silencieux = true lors d'une ouverture déclenchée par l'URL (pas de nouvelle entrée d'historique)
function openRecipe(id, silencieux){
  const isRecipe = RECIPES.some(rec => rec.id === id);
  curRecipe = RECIPES.find(rec => rec.id === id) || BASICS.find(rec => rec.id === id);
  if(!curRecipe) return;
  if(!silencieux){
    // une adresse propre, partageable et rechargeable
    history.pushState({ fiche: id }, '', '#' + (isRecipe ? 'recette' : 'fiche') + '=' + id);
  }
  if(isRecipe){
    dlPush('recette_ouverte', {
      recette: curRecipe.fr.title,
      niveau: curRecipe.niveau,
      categorie: curRecipe.cat,
      langue: currentLang
    });
  } else {
    dlPush('fiche_base_ouverte', { fiche: curRecipe.fr.title, groupe: curRecipe.groupe, langue: currentLang });
  }
  openFullView();
}



/* ============ Passerelle Académie → Catalogue ============
   Analyse les ingrédients de la recette pour proposer la catégorie 4Cake pertinente. */
const CATALOGUE_URL = '/ar/index.html';

const MOTS_CATEGORIE = [
  { cat:'chocolat',    mots:['chocolat','cacao','ganache','couverture','praliné','gianduja','شوكولاتة','كاكاو'] },
  { cat:'feuilletine', mots:['feuilletine','crêpe dentelle','croustillant','فوييتين'] },
  { cat:'topping',     mots:['amande','noisette','pistache','noix','sésame','coco','fruits secs','pécan','لوز','بندق','فستق','جوز','سمسم','جوز الهند'] },
  { cat:'decors',      mots:['colorant','décor','vermicelle','perles','paillettes','nappage','ملون','زينة'] },
  { cat:'pate',        mots:['pâte à sucre','fondant','glaçage','pastillage','عجينة السكر','فوندان'] }
];

function categoriePertinente(item){
  const d = item.fr; // on analyse toujours le français, plus riche en mots-clés
  if(!d || !d.ingredients) return null;
  const texte = d.ingredients.map(([n]) => n.toLowerCase()).join(' ');
  const scores = MOTS_CATEGORIE.map(g => ({
    cat: g.cat,
    score: g.mots.filter(m => texte.indexOf(m) > -1).length
  })).filter(x => x.score > 0).sort((a,b) => b.score - a.score);
  return scores.length ? scores[0].cat : null;
}

function encartCatalogue(item){
  if(!RECIPES.some(x => x.id === item.id)) return ''; // pas sur les fiches techniques
  const t = UI[currentLang];
  const cat = categoriePertinente(item);
  const url = CATALOGUE_URL + (cat ? '?cat=' + cat : '') + '#catalogue';
  return `
    <div class="fv-shop">
      <div class="fv-shop-txt">
        <strong>${t.shop_titre}</strong>
        <span>${t.shop_texte}</span>
      </div>
      <a class="fv-shop-btn" href="${url}" data-cat="${cat || 'tous'}" onclick="dlPush('clic_catalogue_depuis_fiche_public',{fiche:${JSON.stringify((item.fr && item.fr.title) || item.id)},categorie:${JSON.stringify(cat||'tous')}})">
        ${t.shop_cta}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>`;
}

/* Partage : API native du téléphone si disponible (WhatsApp, SMS…), sinon copie du lien */
/* Transition explicite vers l'Espace Pro : rend visible le changement de niveau,
   au lieu d'une redirection silencieuse. */
let _ptSource = null;
function openProTransition(url, source){
  _ptSource = source;
  const t = UI[currentLang];
  document.getElementById('ptTitle').textContent = t.pt_titre;
  document.getElementById('ptText').textContent = t.pt_texte;
  document.getElementById('ptCancel').textContent = t.pt_annuler;
  document.getElementById('ptContinueLabel').textContent = t.pt_continuer;
  document.getElementById('ptContinue').setAttribute('href', url);
  document.getElementById('proTransitionOverlay').classList.add('open');
  dlPush('vue_transition_pro', { depuis: source, section: activeSection, langue: currentLang });
}
function closeProTransition(){
  document.getElementById('proTransitionOverlay').classList.remove('open');
}
document.getElementById('proTransitionOverlay').addEventListener('click', function(e){
  if(e.target.id === 'proTransitionOverlay') closeProTransition();
});
document.getElementById('ptContinue').addEventListener('click', function(){
  dlPush('clic_espace_pro', { depuis: _ptSource, section: activeSection, langue: currentLang });
});

function partagerRecette(){
  if(!curRecipe) return;
  const d = r(curRecipe);
  const isRecipe = RECIPES.some(x => x.id === curRecipe.id);
  const url = location.origin + location.pathname + '#' + (isRecipe ? 'recette' : 'fiche') + '=' + curRecipe.id;
  dlPush('partage_recette', { recette: d.title, langue: currentLang });

  if(navigator.share){
    navigator.share({ title: d.title, text: d.title + ' — 4Cake Académie', url: url }).catch(() => {});
    return;
  }
  const fini = () => {
    const b = document.querySelector('.fv-share-btn');
    if(!b) return;
    const avant = b.innerHTML;
    b.innerHTML = UI[currentLang].lien_copie;
    setTimeout(() => { b.innerHTML = avant; }, 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(fini).catch(() => window.prompt(UI[currentLang].partager, url));
  } else {
    window.prompt(UI[currentLang].partager, url);
  }
}

function applyStaticTranslations(lang){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(UI[lang][key] !== undefined){
      if(el.children.length === 0){
        el.textContent = UI[lang][key];
      } else {
        for(const node of el.childNodes){
          if(node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0){
            node.textContent = UI[lang][key];
            break;
          }
        }
      }
    }
  });
}

function setLang(lang){
  if(window.__langReady && lang !== currentLang) dlPush('changement_langue', { langue: lang });
  currentLang = lang;
  localStorage.setItem('4cake_lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('lang-ar').classList.toggle('active', lang === 'ar');
  applyStaticTranslations(lang);
  const si = document.getElementById('searchInput');
  if(si) si.placeholder = UI[lang].search_placeholder;
  renderGrid();
}

// Bande défilante : sélection limitée (performance mobile), dupliquée pour une boucle sans couture
const MARQUEE_PER_ROW = 14;
function buildMarquee(){
  const uniq = [...new Set(Object.values(RECIPE_IMG))];
  for(let i = uniq.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [uniq[i], uniq[j]] = [uniq[j], uniq[i]];
  }
  const rows = [uniq.slice(0, MARQUEE_PER_ROW), uniq.slice(MARQUEE_PER_ROW, MARQUEE_PER_ROW * 2)];
  ['marqueeRow1','marqueeRow2'].forEach((id, k) => {
    const list = rows[k].length ? rows[k] : rows[0];
    const html = list.map(src =>
      `<img src="${IMG_BASE}${src}" alt="" loading="lazy" decoding="async" onerror="this.remove();">`
    ).join('');
    document.getElementById(id).innerHTML = html + html; // doublé => boucle continue
  });
}
buildMarquee();

/* Clics sortants : Espace Pro (avec transition explicite) et retour vitrine */
document.addEventListener('click', function(e){
  const a = e.target.closest('a[href]');
  if(!a) return;
  const href = a.getAttribute('href') || '';
  if(href.indexOf('../pro/') === 0 || href.indexOf('/pro/') > -1){
    if(a.id === 'ptContinue') return; // clic de confirmation dans le modal : on laisse naviguer
    e.preventDefault();
    openProTransition(href, a.classList.contains('pro-cta') ? 'bouton_cta' : a.classList.contains('rcard-pro') ? 'carte_teaser' : 'lien');
  } else if(href === '../../' || href === '../../index.html' || href.indexOf('4cake.ma') > -1){
    dlPush('retour_vitrine', { langue: currentLang });
  }
}, true);

setLang(currentLang); // applique aussi le placeholder de recherche

/* ============ Routage par ancre ============
   Permet de partager une recette précise : .../public/#recette=chebakia
   et gère le bouton Retour du navigateur. */
function idDepuisHash(){
  const h = decodeURIComponent(location.hash || '').replace(/^#/, '');
  const m = h.match(/^(?:recette|fiche)=(.+)$/);
  return m ? m[1] : null;
}

function appliquerHash(){
  const id = idDepuisHash();
  if(id){
    const existe = RECIPES.some(x => x.id === id) || BASICS.some(x => x.id === id);
    if(existe){ openRecipe(id, true); return; }
    // ancre inconnue (recette renommée, lien erroné) : on nettoie sans bloquer l'utilisateur
    history.replaceState({}, '', location.pathname + location.search);
  }
  closeFullView(true);
}

window.addEventListener('popstate', appliquerHash);
appliquerHash(); // au chargement : ouvre directement la fiche si l'URL en désigne une


window.__langReady = true;
</script>
