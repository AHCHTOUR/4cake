<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب عرض السعر الخاص بكم — 4Cake</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--dore:#D4A017;--brun:#3A2E1A;--creme:#FBF6E9;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--creme);color:var(--brun);line-height:1.7;}
header{background:var(--brun);padding:14px 20px;}
header a{color:var(--dore);text-decoration:none;font-weight:700;font-size:0.95rem;}
main{max-width:600px;margin:0 auto;padding:32px 20px 60px;}
h1{font-size:1.4rem;margin:0 0 4px;}
.ref{color:#6B5E4E;font-size:0.9rem;margin-bottom:24px;}
.card{background:#fff;border:1px solid #E9DCC0;border-radius:14px;padding:20px;margin-bottom:16px;}
.card h2{font-size:0.95rem;color:var(--brun);border-bottom:2px solid var(--dore);padding-bottom:6px;margin:0 0 12px;}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E9DCC0;font-size:0.92rem;}
.row:last-child{border-bottom:none;}
.row span:first-child{color:#6B5E4E;}
.total{font-size:1.1rem;font-weight:700;color:var(--brun);text-align:right;margin-top:8px;}
.status{display:inline-block;background:var(--dore);color:#fff;font-size:0.8rem;font-weight:700;padding:4px 12px;border-radius:100px;}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--brun);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:100px;}
.loading, .error{text-align:center;padding:60px 20px;color:#6B5E4E;}
footer{text-align:center;padding:24px;font-size:0.85rem;color:#6B5E4E;}
</style>
</head>
<body>
<header><a href="/ar/index.html">→ 4Cake</a></header>
<main>
<div id="content" class="loading">جارٍ تحميل عرض السعر…</div>
</main>
<footer>4Cake — <a href="/ar/index.html">4cake.ma</a></footer>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
const content = document.getElementById('content');

if (!id) {
  content.className = 'error';
  content.innerHTML = 'لم يتم تقديم معرف عرض السعر.';
} else {
  fetch('https://script.google.com/macros/s/AKfycbxJr8v042sakD1F2H7GSrd9_lJPboLitSAQjb9zA-I13V8Ys-N7cyliWXHZYHYKAmw/exec?id=' + encodeURIComponent(id))
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        content.className = 'error';
        content.innerHTML = 'عرض السعر غير موجود. تحققوا من الرابط المستلم أو تواصلوا معنا مباشرة.';
        return;
      }
      let produits = [];
      try { produits = data.produits || []; } catch(e) {}
      const lignesHtml = produits.map(p =>
        `<div class="row"><span>${p.name} × ${p.qty}</span><span>${p.lineTotal} درهم</span></div>`
      ).join('');
      const dateAffichee = data.date ? new Date(data.date).toLocaleDateString('ar-MA', {year:'numeric',month:'long',day:'numeric'}) : '';

      content.className = '';
      content.innerHTML = `
        <h1>عرض السعر ${data.id}</h1>
        <div class="ref">بتاريخ ${dateAffichee} — <span class="status">${data.statut || 'جديد'}</span></div>
        <div class="card">
          <h2>معلوماتكم</h2>
          <div class="row"><span>الشركة</span><span>${data.company || '—'}</span></div>
          <div class="row"><span>المسؤول</span><span>${data.name || '—'}</span></div>
          <div class="row"><span>الهاتف</span><span>${data.phone || '—'}</span></div>
          <div class="row"><span>المدينة</span><span>${data.city || '—'}</span></div>
          <div class="row"><span>وتيرة الطلب</span><span>${data.freq || '—'}</span></div>
        </div>
        <div class="card">
          <h2>المنتجات المختارة</h2>
          ${lignesHtml || '<div class="row"><span>لا توجد تفاصيل منتجات</span></div>'}
          <div class="total">المجموع التقديري: ${data.total || 0} درهم</div>
        </div>
        ${data.message ? `<div class="card"><h2>رسالتكم</h2><p>${data.message}</p></div>` : ''}
        <a class="cta" href="https://wa.me/212661759934?text=مرحبا%2C%20أتواصل%20معكم%20بخصوص%20عرض%20السعر%20${encodeURIComponent(data.id)}">تواصلوا معنا عبر واتساب</a>
      `;
    })
    .catch(() => {
      content.className = 'error';
      content.innerHTML = 'تعذّر تحميل عرض السعر هذا حاليًا. أعيدوا المحاولة بعد قليل.';
    });
}
</script>
</body>
</html>
