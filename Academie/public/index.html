<style>
  :root{
    --creme:#FBF3E4; --marine:#4A3626; --marine-2:#6B5240; --marine-soft:#F3E4C7;
    --rouge:#C1573A; --rouge-dark:#9C4530; --butter:#E3A857; --grey:#8F7D68; --sauge:#6B7A54;
    --shadow:0 10px 26px rgba(62,42,30,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--creme); color:var(--marine); font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}

  header{position:sticky; top:0; z-index:20; background:rgba(255,248,239,0.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(62,42,30,0.08);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:0.9rem;}
  .brand img{height:28px;}
  .brand b{font-family:'Anton',sans-serif;}
  .brand .tag{font-size:0.66rem; background:rgba(201,122,61,0.14); color:var(--rouge-dark); padding:3px 8px; border-radius:5px; margin-inline-start:4px; font-weight:700;}
  .nav-actions{display:flex; align-items:center; gap:10px; font-size:0.82rem;}
  .nav-actions a{padding:8px 14px; border-radius:100px; border:1px solid var(--marine);}
  .nav-actions a:hover{background:var(--marine); color:#fff;}
  .nav-actions .pro-link{background:var(--marine); color:#fff; border:none; font-weight:700; display:flex; align-items:center; gap:6px;}

  .lang-toggle{display:flex; align-items:center; background:var(--marine-soft); border-radius:100px; padding:3px; gap:2px;}
  .lang-btn{padding:7px 12px; border-radius:100px; font-weight:700; font-size:0.76rem; color:var(--marine-2); transition:all 0.18s ease;}
  .lang-btn.active{background:var(--marine); color:#fff;}

  .hero{padding:44px 0 26px; text-align:center;}
  .kicker{display:inline-block; font-size:0.8rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--rouge-dark); margin-bottom:12px;}
  h1{font-family:'Anton',sans-serif; font-size:clamp(1.7rem,4vw,2.4rem); text-transform:uppercase; margin:0 0 10px;}
  h1 .script{display:block; font-family:'Kaushan Script',cursive; text-transform:none; font-size:0.6em; color:var(--rouge); margin-top:3px;}
  .hero p{max-width:520px; margin:0 auto; color:var(--marine-2); line-height:1.55; font-size:0.94rem;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; padding:8px 0 70px;}
  .rcard{background:#fff; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform 0.18s ease; border:1px solid rgba(62,42,30,0.06);}
  .rcard:hover{transform:translateY(-3px);}
  .rcard-visual{height:110px; display:flex; align-items:center; justify-content:center;}
  .rcard-visual svg{width:46px; height:46px;}
  .rcard-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px;}
  .rcard-title{font-weight:700; font-size:0.98rem;}
  .rcard-meta{font-size:0.74rem; color:var(--grey); display:flex; gap:8px;}
  .rcard-meta span{background:var(--marine-soft); padding:4px 9px; border-radius:100px;}
  .rcard-play{font-size:0.82rem; font-weight:700; color:var(--rouge-dark); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .rcard-play svg{width:12px; height:12px;}

  /* ---------- Visionneuse capsules ---------- */
  .story-overlay{position:fixed; inset:0; background:rgba(62,42,30,0.6); z-index:100; display:none; align-items:center; justify-content:center;}
  .story-overlay.open{display:flex;}
  .story-frame{
    position:relative; width:min(94vw,380px); height:min(86vh,720px);
    background:var(--creme); border-radius:22px; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 30px 70px rgba(62,42,30,0.35);
  }
  .story-bars{display:flex; gap:5px; padding:12px 14px 0;}
  .story-bar{flex:1; height:3px; background:rgba(62,42,30,0.14); border-radius:3px; overflow:hidden;}
  .story-bar i{display:block; height:100%; width:0%; background:var(--rouge);}
  .story-bar.done i{width:100%;}
  .story-top{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0;}
  .story-mod-title{font-size:0.78rem; font-weight:700; color:var(--marine-2);}
  .story-close{width:30px; height:30px; border-radius:50%; background:var(--marine-soft); display:flex; align-items:center; justify-content:center;}
  .story-close svg{width:14px; height:14px;}
  .story-tapzones{position:absolute; inset:0; top:52px; display:flex; z-index:2;}
  .story-tapzones div{flex:1;}
  .story-body{flex-grow:1; display:flex; align-items:center; justify-content:center; padding:22px 26px 26px; text-align:center; position:relative;}
  .capsule{display:none; flex-direction:column; align-items:center; gap:12px; animation:capsuleIn 0.35s ease;}
  .capsule.active{display:flex;}
  @keyframes capsuleIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .cap-label{font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark);}
  .cap-label.tip{color:var(--sauge);}
  .cap-label.swap{color:var(--rouge-dark);}
  .cap-title{font-family:'Anton',sans-serif; font-size:1.35rem; text-transform:uppercase; line-height:1.15;}
  .cap-hook{color:var(--marine-2); font-size:0.88rem; line-height:1.5; max-width:280px;}
  .cap-num-badge{width:32px; height:32px; border-radius:50%; background:var(--rouge); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:0.9rem;}
  .cap-text{font-size:1.12rem; line-height:1.5; font-weight:500; max-width:290px; color:var(--marine);}
  .cap-tipbox{background:var(--marine-soft); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-swapbox{background:#FBEFE0; border:1px dashed var(--rouge); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-number{font-family:'Anton',sans-serif; font-size:2.3rem; color:var(--rouge-dark); line-height:1;}
  .cap-number-label{font-size:0.82rem; color:var(--marine-2);}
  .ing-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-width:280px; width:100%;}
  .ing-list li{display:flex; justify-content:space-between; font-size:0.86rem; padding-bottom:7px; border-bottom:1px dashed rgba(62,42,30,0.14);}
  .ing-list b{color:var(--rouge-dark);}

  .story-nav{display:flex; gap:10px; padding:0 20px 20px;}
  .story-btn{flex:1; padding:12px; border-radius:100px; font-weight:700; font-size:0.85rem; text-align:center;}
  .story-btn.prev{background:var(--marine-soft); color:var(--marine);}
  .story-btn.next{background:var(--rouge); color:#fff;}
  .story-btn[disabled]{opacity:0.3; pointer-events:none;}

  footer{padding:26px 0; text-align:center; font-size:0.78rem; color:var(--marine-2);}
  @media (max-width:480px){ .story-frame{border-radius:0; width:100vw; height:100vh;} }

  /* ---------- RTL adjustments ---------- */
  html[dir="rtl"] body{font-family:'Cairo', 'Poppins', sans-serif;}
  html[dir="rtl"] h1, html[dir="rtl"] .cap-title{font-family:'Cairo', 'Anton', sans-serif; text-transform:none;}
  html[dir="rtl"] .kicker, html[dir="rtl"] .cap-label{font-family:'Cairo', sans-serif;}
  html[dir="rtl"] .nav-actions a svg{transform:scaleX(-1);}
</style>
</head>

let currentLang = localStorage.getItem('4cake_lang') || 'fr';

function r(recipe){ return recipe[currentLang]; }

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = RECIPES.map(rec => {
    const d = r(rec);
    return `
    <div class="rcard" onclick="openStory('${rec.id}')">
      <div class="rcard-visual" style="background:var(--marine-soft)">${ICONS[rec.icon]}</div>
      <div class="rcard-body">
        <div class="rcard-title">${d.title}</div>
        <div class="rcard-meta"><span>⏱ ${d.time}</span><span>${d.level}</span></div>
        <div class="rcard-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
          ${UI[currentLang].voir_capsule}
        </div>
      </div>
    </div>
  `;}).join('');
}

let curRecipe = null, curCap = 0, timer = null;
const CAP_DURATION = 4500;

function openStory(id){
  curRecipe = RECIPES.find(rec => rec.id === id);
  curCap = 0;
  const d = r(curRecipe);
  document.getElementById('storyModTitle').textContent = d.title;
  document.getElementById('storyBars').innerHTML = d.capsules.map(() => `<div class="story-bar"><i></i></div>`).join('');
  const body = document.getElementById('storyBody');
  body.querySelectorAll('.capsule').forEach(c => c.remove());
  d.capsules.forEach((c, idx) => body.insertAdjacentHTML('beforeend', capsuleHTML(c, idx, d)));
  document.getElementById('storyOverlay').classList.add('open');
  renderCap();
}
function capsuleHTML(c, idx, recipe){
  const t = UI[currentLang];
  if(c.type === 'title') return `<div class="capsule" data-i="${idx}">
      <div class="cap-title">${c.title}</div><div class="cap-hook">${c.hook}</div></div>`;
  if(c.type === 'ing') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">${t.ingredients}</div>
      <ul class="ing-list">${recipe.ingredients.map(([n,q]) => `<li><span>${n}</span><b>${q}</b></li>`).join('')}</ul></div>`;
  if(c.type === 'step') return `<div class="capsule" data-i="${idx}">
      <div class="cap-num-badge">${c.n}</div><div class="cap-text">${c.text}</div></div>`;
  if(c.type === 'number') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">${t.repere}</div><div class="cap-number">${c.value}</div><div class="cap-number-label">${c.label}</div></div>`;
  if(c.type === 'tip') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label tip">${t.astuce}</div><div class="cap-tipbox">${c.text}</div></div>`;
  if(c.type === 'swap') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label swap">${t.equivalent}</div><div class="cap-swapbox">${c.text}</div></div>`;
  return '';
}
function renderCap(){
  const caps = document.querySelectorAll('.capsule');
  const bars = document.querySelectorAll('.story-bar');
  caps.forEach((c,i) => c.classList.toggle('active', i === curCap));
  bars.forEach((b,i) => {
    b.classList.toggle('done', i < curCap);
    const bar = b.querySelector('i');
    if(i < curCap){ bar.style.transition='none'; bar.style.width='100%'; }
    else if(i === curCap){ bar.style.transition='none'; bar.style.width='0%'; requestAnimationFrame(()=>{ bar.style.transition=`width ${CAP_DURATION}ms linear`; bar.style.width='100%'; }); }
    else { bar.style.transition='none'; bar.style.width='0%'; }
  });
  document.getElementById('btnPrev').disabled = curCap === 0;
  document.getElementById('btnNext').textContent = curCap === r(curRecipe).capsules.length - 1 ? UI[currentLang].btn_termine : UI[currentLang].btn_suivant;
  clearTimeout(timer);
  timer = setTimeout(() => { if(curCap < r(curRecipe).capsules.length - 1) nextCap(); }, CAP_DURATION);
}
function nextCap(){
  if(curCap < r(curRecipe).capsules.length - 1){ curCap++; renderCap(); }
  else { closeStory(); }
}
function prevCap(){
  if(curCap > 0){ curCap--; renderCap(); }
}
function closeStory(){
  clearTimeout(timer);
  document.getElementById('storyOverlay').classList.remove('open');
}
document.getElementById('storyOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'storyOverlay') closeStory();
});

function applyStaticTranslations(lang){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(UI[lang][key] !== undefined){
      if(el.children.length === 0){
        el.textContent = UI[lang][key];
      } else {
        for(const node of el.childNodes){
          if(node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0){
            node.textContent = UI[lang][key];
            break;
          }
        }
      }
    }
  });
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('4cake_lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('lang-ar').classList.toggle('active', lang === 'ar');
  applyStaticTranslations(lang);
  renderGrid();
}

setLang(currentLang);
</script>
