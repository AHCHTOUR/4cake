<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recettes — Académie For Your Cake</title>
<meta name="description" content="Des recettes de chef expliquées en micro-capsules, sans jargon, pas à pas.">
<link rel="icon" href="../../LOGO_MARQUE.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#FFF8EF; --marine:#3E2A1E; --marine-2:#5C4030; --marine-soft:#F7E9DD;
    --rouge:#C97A3D; --rouge-dark:#A85F27; --butter:#F2C94C; --grey:#8A7A6C;
    --shadow:0 10px 26px rgba(62,42,30,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--creme); color:var(--marine); font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}

  header{position:sticky; top:0; z-index:20; background:rgba(255,248,239,0.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(62,42,30,0.08);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:0.9rem;}
  .brand img{height:28px;}
  .brand b{font-family:'Anton',sans-serif;}
  .brand .tag{font-size:0.66rem; background:rgba(201,122,61,0.14); color:var(--rouge-dark); padding:3px 8px; border-radius:5px; margin-inline-start:4px; font-weight:700;}
  .nav-actions{display:flex; align-items:center; gap:10px; font-size:0.82rem;}
  .nav-actions a{padding:8px 14px; border-radius:100px; border:1px solid var(--marine);}
  .nav-actions a:hover{background:var(--marine); color:#fff;}
  .nav-actions .pro-link{background:var(--marine); color:#fff; border:none; font-weight:700; display:flex; align-items:center; gap:6px;}

  .hero{padding:44px 0 26px; text-align:center;}
  .kicker{display:inline-block; font-size:0.8rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--rouge-dark); margin-bottom:12px;}
  h1{font-family:'Anton',sans-serif; font-size:clamp(1.7rem,4vw,2.4rem); text-transform:uppercase; margin:0 0 10px;}
  h1 .script{display:block; font-family:'Kaushan Script',cursive; text-transform:none; font-size:0.6em; color:var(--rouge); margin-top:3px;}
  .hero p{max-width:520px; margin:0 auto; color:var(--marine-2); line-height:1.55; font-size:0.94rem;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; padding:8px 0 70px;}
  .rcard{background:#fff; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform 0.18s ease; border:1px solid rgba(62,42,30,0.06);}
  .rcard:hover{transform:translateY(-3px);}
  .rcard-visual{height:110px; display:flex; align-items:center; justify-content:center;}
  .rcard-visual svg{width:46px; height:46px;}
  .rcard-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px;}
  .rcard-title{font-weight:700; font-size:0.98rem;}
  .rcard-meta{font-size:0.74rem; color:var(--grey); display:flex; gap:8px;}
  .rcard-meta span{background:var(--marine-soft); padding:4px 9px; border-radius:100px;}
  .rcard-play{font-size:0.82rem; font-weight:700; color:var(--rouge-dark); display:flex; align-items:center; gap:6px; margin-top:2px;}
  .rcard-play svg{width:12px; height:12px;}

  /* ---------- Visionneuse capsules ---------- */
  .story-overlay{position:fixed; inset:0; background:rgba(62,42,30,0.6); z-index:100; display:none; align-items:center; justify-content:center;}
  .story-overlay.open{display:flex;}
  .story-frame{
    position:relative; width:min(94vw,380px); height:min(86vh,720px);
    background:var(--creme); border-radius:22px; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 30px 70px rgba(62,42,30,0.35);
  }
  .story-bars{display:flex; gap:5px; padding:12px 14px 0;}
  .story-bar{flex:1; height:3px; background:rgba(62,42,30,0.14); border-radius:3px; overflow:hidden;}
  .story-bar i{display:block; height:100%; width:0%; background:var(--rouge);}
  .story-bar.done i{width:100%;}
  .story-top{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0;}
  .story-mod-title{font-size:0.78rem; font-weight:700; color:var(--marine-2);}
  .story-close{width:30px; height:30px; border-radius:50%; background:var(--marine-soft); display:flex; align-items:center; justify-content:center;}
  .story-close svg{width:14px; height:14px;}
  .story-tapzones{position:absolute; inset:0; top:52px; display:flex; z-index:2;}
  .story-tapzones div{flex:1;}
  .story-body{flex-grow:1; display:flex; align-items:center; justify-content:center; padding:22px 26px 26px; text-align:center; position:relative;}
  .capsule{display:none; flex-direction:column; align-items:center; gap:12px; animation:capsuleIn 0.35s ease;}
  .capsule.active{display:flex;}
  @keyframes capsuleIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .cap-label{font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:var(--rouge-dark);}
  .cap-label.tip{color:#8A6D2E;}
  .cap-label.swap{color:var(--rouge-dark);}
  .cap-title{font-family:'Anton',sans-serif; font-size:1.35rem; text-transform:uppercase; line-height:1.15;}
  .cap-hook{color:var(--marine-2); font-size:0.88rem; line-height:1.5; max-width:280px;}
  .cap-num-badge{width:32px; height:32px; border-radius:50%; background:var(--rouge); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:0.9rem;}
  .cap-text{font-size:1.12rem; line-height:1.5; font-weight:500; max-width:290px; color:var(--marine);}
  .cap-tipbox{background:var(--marine-soft); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-swapbox{background:#FBEFE0; border:1px dashed var(--rouge); border-radius:12px; padding:12px 14px; font-size:0.85rem; color:var(--marine-2); max-width:280px; line-height:1.5;}
  .cap-number{font-family:'Anton',sans-serif; font-size:2.3rem; color:var(--rouge-dark); line-height:1;}
  .cap-number-label{font-size:0.82rem; color:var(--marine-2);}
  .ing-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-width:280px; width:100%;}
  .ing-list li{display:flex; justify-content:space-between; font-size:0.86rem; padding-bottom:7px; border-bottom:1px dashed rgba(62,42,30,0.14);}
  .ing-list b{color:var(--rouge-dark);}

  .story-nav{display:flex; gap:10px; padding:0 20px 20px;}
  .story-btn{flex:1; padding:12px; border-radius:100px; font-weight:700; font-size:0.85rem; text-align:center;}
  .story-btn.prev{background:var(--marine-soft); color:var(--marine);}
  .story-btn.next{background:var(--rouge); color:#fff;}
  .story-btn[disabled]{opacity:0.3; pointer-events:none;}

  footer{padding:26px 0; text-align:center; font-size:0.78rem; color:var(--marine-2);}
  @media (max-width:480px){ .story-frame{border-radius:0; width:100vw; height:100vh;} }
</style>
</head>
<body>

<header>
  <div class="container top-row">
    <div class="brand">
      <img src="../../LOGO_MARQUE.png" alt="For Your Cake">
      <b>Académie</b><span class="tag">RECETTES</span>
    </div>
    <div class="nav-actions">
      <a href="../index.html">← Portail</a>
      <a class="pro-link" href="../pro/index.html">
        <svg viewBox="0 0 64 64" width="16" height="16">
          <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 33c-4.5 0-8-3.6-8-7.8 0-3.7 2.7-6.8 6.3-7.6.4-4.4 4.3-7.8 9-7.8 2.1 0 4 .7 5.5 1.9C31.3 9.6 33 8.8 35 8.8c4.4 0 8 3.4 8.3 7.7 3.9.5 6.9 3.7 6.9 7.6 0 4.2-3.6 7.9-8 7.9"/>
            <path d="M17 33v8.5h30V33"/>
            <path d="M14.5 41.5h35v6.4c0 1.2-1 2.1-2.2 2.1H16.7c-1.2 0-2.2-.9-2.2-2.1v-6.4Z"/>
          </g>
        </svg>
        Espace Pro
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <span class="kicker">Recettes en micro-capsules</span>
    <h1>Des classiques de chef<span class="script">une étape à la fois</span></h1>
    <p>Peu de texte, un geste par écran. Tapez pour avancer, comme une story.</p>
  </div>
</section>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<div class="story-overlay" id="storyOverlay">
  <div class="story-frame">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-top">
      <span class="story-mod-title" id="storyModTitle"></span>
      <button class="story-close" onclick="closeStory()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="story-body" id="storyBody">
      <div class="story-tapzones"><div onclick="prevCap()"></div><div onclick="nextCap()"></div></div>
    </div>
    <div class="story-nav">
      <button class="story-btn prev" id="btnPrev" onclick="prevCap()">←</button>
      <button class="story-btn next" id="btnNext" onclick="nextCap()">Suivant</button>
    </div>
  </div>
</div>

<footer><div class="container">Académie For Your Cake — contenu pédagogique original.</div></footer>

<script>
const ICONS = {
  chocolat:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 7l4-4h10l4 4M8 11v6M12 11v6M16 11v6"/></svg>`,
  citron:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><ellipse cx="12" cy="12" rx="8" ry="9"/><path d="M12 3c2 2 3 5.5 3 9s-1 7-3 9"/></svg>`,
  eclair:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><rect x="2" y="9" width="20" height="7" rx="3.5"/></svg>`,
  financier:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><rect x="3" y="8" width="18" height="9" rx="3"/></svg>`,
  tatin:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 9c1-1.5 2-2 4-2s3 .5 4 2M8 15c1 1.5 2 2 4 2s3-.5 4-2"/></svg>`,
  layer:`<svg viewBox="0 0 24 24" fill="none" stroke="#C97A3D" stroke-width="1.6"><path d="M4 18V9l8-4 8 4v9M4 18l8 4 8-4M4 13l8 4 8-4"/></svg>`
};

const RECIPES = [
{id:'fondant', icon:'chocolat', title:'Fondant cœur coulant', time:'30 min', level:'Facile',
  ingredients:[['Chocolat noir','200 g'],['Beurre','150 g'],['Œufs','4'],['Sucre','120 g'],['Farine','60 g']],
  capsules:[
    {type:'title', title:'Fondant cœur coulant', hook:"Croûte fine, cœur qui coule à la cuillère."},
    {type:'ing'},
    {type:'step', n:1, text:"Beurrez très généreusement les moules, jusqu'en haut des bords."},
    {type:'step', n:2, text:"Fondez chocolat + beurre ensemble, doucement."},
    {type:'step', n:3, text:"Fouettez œufs + sucre 2-3 min, jusqu'à blanchir."},
    {type:'step', n:4, text:"Mélangez chocolat tiède + œufs, puis la farine — juste assez pour l'incorporer."},
    {type:'number', value:'200°C · 9-11 min', label:'Bords pris, centre encore tremblant'},
    {type:'tip', text:"Sortez 1 minute trop tôt plutôt que trop tard : le cœur finit de cuire hors du four."}
  ]},
{id:'citron', icon:'citron', title:'Tarte citron meringuée', time:'1h + repos', level:'Intermédiaire',
  ingredients:[['Pâte sablée','1 fond'],['Jus de citron','150 ml'],['Œufs','3'],['Sucre','150 g'],['Beurre','100 g'],['Blancs (meringue)','3']],
  capsules:[
    {type:'title', title:'Tarte citron meringuée', hook:"Croustillant, acidulé, léger — le trio gagnant."},
    {type:'ing'},
    {type:'step', n:1, text:"Cuisson à blanc du fond : 15 min à 180°C, avec des poids."},
    {type:'swap', text:"Pas de billes de cuisson ? Des haricots secs ou du riz cru font le même travail."},
    {type:'step', n:2, text:"Crème citron : œufs + sucre + jus, épaissir à feu doux sans bouillir."},
    {type:'step', n:3, text:"Hors du feu, incorporez le beurre en dés, morceau par morceau."},
    {type:'step', n:4, text:"Montez les blancs en neige, sucre ajouté en 3 fois."},
    {type:'number', value:'2h', label:'Froid minimum avant de dresser la meringue'},
    {type:'tip', text:"Pas de chalumeau ? Grill du four, porte entrouverte, en surveillant en continu."}
  ]},
{id:'eclairs', icon:'eclair', title:'Éclairs café', time:'1h30', level:'Intermédiaire',
  ingredients:[['Lait + eau','125 ml + 125 ml'],['Beurre','110 g'],['Farine','140 g'],['Œufs','4 env.'],['Café soluble','2 c.à.s']],
  capsules:[
    {type:'title', title:'Éclairs café', hook:"La pâte qui gonfle bien, un glaçage qui claque."},
    {type:'ing'},
    {type:'step', n:1, text:"Portez lait, eau, beurre à ébullition, versez la farine en une fois."},
    {type:'step', n:2, text:"Desséchez 1-2 min sur le feu : la pâte doit se détacher des parois."},
    {type:'step', n:3, text:"Incorporez les œufs un par un, jusqu'à un ruban lisse et brillant."},
    {type:'step', n:4, text:"Dressez, enfournez — sans jamais ouvrir la porte avant 20 minutes."},
    {type:'number', value:'180-200°C', label:'20 min sans ouvrir le four'},
    {type:'step', n:5, text:"Garnissez de crème pâtissière café, glacez, laissez figer."}
  ]},
{id:'financiers', icon:'financier', title:'Financiers amande', time:'35 min', level:'Facile',
  ingredients:[['Beurre','150 g'],['Blancs d\'œufs','5'],['Sucre glace','150 g'],['Poudre d\'amande','80 g'],['Farine','60 g']],
  capsules:[
    {type:'title', title:'Financiers amande', hook:"Le petit gâteau moelleux au beurre noisette."},
    {type:'ing'},
    {type:'step', n:1, text:"Faites un beurre noisette : couleur ambrée, odeur de fruit sec grillé."},
    {type:'tip', text:"Retirez du feu un peu avant la couleur parfaite — il continue de cuire dans la casserole chaude."},
    {type:'step', n:2, text:"Mélangez sucre glace, poudre d'amande, farine, puis les blancs."},
    {type:'step', n:3, text:"Versez le beurre chaud en filet, mélangez bien."},
    {type:'number', value:'20 min mini', label:'Repos au froid — donne le moelleux caractéristique'},
    {type:'step', n:4, text:"Cuisson 200°C, 12-15 minutes, bords bien dorés."}
  ]},
{id:'tatin', icon:'tatin', title:'Tarte Tatin', time:'1h15', level:'Intermédiaire',
  ingredients:[['Pommes fermes','8 à 10'],['Sucre','150 g'],['Beurre','80 g'],['Pâte feuilletée','1 rouleau']],
  capsules:[
    {type:'title', title:'Tarte Tatin', hook:"La seule tarte qui se fait à l'envers."},
    {type:'ing'},
    {type:'step', n:1, text:"Caramel à sec : sucre fondu sans y toucher, inclinez le moule si besoin."},
    {type:'tip', text:"Ne remuez jamais un caramel à sec à la cuillère — ça le fait cristalliser."},
    {type:'step', n:2, text:"Beurre en dés hors du feu, puis les pommes serrées, tassées."},
    {type:'step', n:3, text:"Pâte par-dessus, bords rentrés à l'intérieur du moule."},
    {type:'number', value:'200°C · 25-30 min', label:'Pâte bien dorée et gonflée'},
    {type:'step', n:4, text:"Démoulez aussitôt en retournant — attention, le caramel est brûlant."}
  ]},
{id:'layercake', icon:'layer', title:'Layer cake vanille-framboise', time:'2h', level:'Intermédiaire',
  ingredients:[['Œufs','6'],['Sucre','200 g'],['Farine','200 g'],['Beurre pommade','250 g'],['Sucre glace','300 g'],['Confiture framboise','150 g']],
  capsules:[
    {type:'title', title:'Layer cake vanille-framboise', hook:"Le gâteau à étages qui impressionne à l'anniversaire."},
    {type:'ing'},
    {type:'step', n:1, text:"Fouettez œufs + sucre jusqu'à tripler de volume et former un ruban."},
    {type:'step', n:2, text:"Incorporez la farine délicatement, en soulevant la masse."},
    {type:'number', value:'180°C · 20-25 min', label:'2-3 disques de génoise'},
    {type:'step', n:3, text:"Crème au beurre : fouettez le beurre seul, puis le sucre glace, puis la vanille."},
    {type:'step', n:4, text:"Montez en alternant génoise, crème, confiture — gardez de la crème pour la fin."},
    {type:'tip', text:"Une fine couche de crème + 20 min au frais avant la couche finale : elle sera bien plus nette."}
  ]}
];

const grid = document.getElementById('grid');
grid.innerHTML = RECIPES.map(r => `
  <div class="rcard" onclick="openStory('${r.id}')">
    <div class="rcard-visual" style="background:var(--marine-soft)">${ICONS[r.icon]}</div>
    <div class="rcard-body">
      <div class="rcard-title">${r.title}</div>
      <div class="rcard-meta"><span>⏱ ${r.time}</span><span>${r.level}</span></div>
      <div class="rcard-play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
        Voir la capsule
      </div>
    </div>
  </div>
`).join('');

let curRecipe = null, curCap = 0, timer = null;
const CAP_DURATION = 4500;

function openStory(id){
  curRecipe = RECIPES.find(r => r.id === id);
  curCap = 0;
  document.getElementById('storyModTitle').textContent = curRecipe.title;
  document.getElementById('storyBars').innerHTML = curRecipe.capsules.map(() => `<div class="story-bar"><i></i></div>`).join('');
  const body = document.getElementById('storyBody');
  body.querySelectorAll('.capsule').forEach(c => c.remove());
  curRecipe.capsules.forEach((c, idx) => body.insertAdjacentHTML('beforeend', capsuleHTML(c, idx, curRecipe)));
  document.getElementById('storyOverlay').classList.add('open');
  renderCap();
}
function capsuleHTML(c, idx, recipe){
  if(c.type === 'title') return `<div class="capsule" data-i="${idx}">
      <div class="cap-title">${c.title}</div><div class="cap-hook">${c.hook}</div></div>`;
  if(c.type === 'ing') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">Ingrédients</div>
      <ul class="ing-list">${recipe.ingredients.map(([n,q]) => `<li><span>${n}</span><b>${q}</b></li>`).join('')}</ul></div>`;
  if(c.type === 'step') return `<div class="capsule" data-i="${idx}">
      <div class="cap-num-badge">${c.n}</div><div class="cap-text">${c.text}</div></div>`;
  if(c.type === 'number') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">Repère</div><div class="cap-number">${c.value}</div><div class="cap-number-label">${c.label}</div></div>`;
  if(c.type === 'tip') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label tip">Astuce</div><div class="cap-tipbox">${c.text}</div></div>`;
  if(c.type === 'swap') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label swap">Équivalent maison</div><div class="cap-swapbox">${c.text}</div></div>`;
  return '';
}
function renderCap(){
  const caps = document.querySelectorAll('.capsule');
  const bars = document.querySelectorAll('.story-bar');
  caps.forEach((c,i) => c.classList.toggle('active', i === curCap));
  bars.forEach((b,i) => {
    b.classList.toggle('done', i < curCap);
    const bar = b.querySelector('i');
    if(i < curCap){ bar.style.transition='none'; bar.style.width='100%'; }
    else if(i === curCap){ bar.style.transition='none'; bar.style.width='0%'; requestAnimationFrame(()=>{ bar.style.transition=`width ${CAP_DURATION}ms linear`; bar.style.width='100%'; }); }
    else { bar.style.transition='none'; bar.style.width='0%'; }
  });
  document.getElementById('btnPrev').disabled = curCap === 0;
  document.getElementById('btnNext').textContent = curCap === curRecipe.capsules.length - 1 ? 'Terminé ✓' : 'Suivant';
  clearTimeout(timer);
  timer = setTimeout(() => { if(curCap < curRecipe.capsules.length - 1) nextCap(); }, CAP_DURATION);
}
function nextCap(){
  if(curCap < curRecipe.capsules.length - 1){ curCap++; renderCap(); }
  else { closeStory(); }
}
function prevCap(){
  if(curCap > 0){ curCap--; renderCap(); }
}
function closeStory(){
  clearTimeout(timer);
  document.getElementById('storyOverlay').classList.remove('open');
}
document.getElementById('storyOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'storyOverlay') closeStory();
});
</script>

</body>
</html>
