<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Pro — 4Cake Académie</title>
<meta name="description" content="Les fondamentaux du métier en micro-capsules : le geste, le chiffre clé, l'erreur à éviter.">
<link rel="icon" href="../../LOGO_MARQUE.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#24211E; --panel:#332C26; --panel-2:#453B32; --line:#5A4C3E;
    --ink:#F3EAE0; --grey:#B9A692; --accent:#C1673D; --warn:#D2483A;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{position:sticky; top:0; z-index:20; background:rgba(35,44,49,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-size:0.9rem;}
  .brand img{height:28px;}
  .brand b{font-family:'Anton',sans-serif;}
  .brand .tag{font-family:'IBM Plex Mono',monospace; font-size:0.66rem; background:rgba(242,201,76,0.15); color:var(--accent); padding:3px 8px; border-radius:5px; margin-inline-start:4px;}
  .nav-actions{display:flex; align-items:center; gap:10px; font-size:0.82rem;}
  .nav-actions a{padding:8px 14px; border-radius:100px; border:1px solid var(--line);}
  .nav-actions a:hover{background:var(--panel-2);}
  .nav-actions .public-link{background:var(--accent); color:var(--bg); border:none; font-weight:700; display:flex; align-items:center; gap:6px;}

  .lang-toggle{display:flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:100px; padding:3px; gap:2px;}
  .lang-btn{padding:7px 12px; border-radius:100px; font-weight:700; font-size:0.76rem; color:var(--grey); transition:all 0.18s ease;}
  .lang-btn.active{background:var(--accent); color:var(--bg);}

  .hero{padding:44px 0 26px;}
  .kicker{font-family:'IBM Plex Mono',monospace; font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin-bottom:12px;}
  h1{font-family:'Anton',sans-serif; font-size:clamp(1.7rem,4vw,2.4rem); text-transform:uppercase; margin:0 0 10px;}
  .hero p{color:var(--grey); max-width:520px; line-height:1.55; font-size:0.94rem; margin:0;}

  /* ---------- Grille des modules ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; padding:8px 0 70px;}
  .mcard{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px;
    cursor:pointer; transition:transform 0.18s ease, border-color 0.18s ease;
    display:flex; flex-direction:column; gap:12px; min-height:150px;
  }
  .mcard:hover{transform:translateY(-3px); border-color:var(--accent);}
  .mcard-top{display:flex; align-items:center; justify-content:space-between;}
  .mcard-num{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--accent);}
  .mcard-dots{display:flex; gap:4px;}
  .mcard-dots span{width:14px; height:3px; border-radius:2px; background:rgba(242,201,76,0.3);}
  .mcard h3{font-family:'Poppins',sans-serif; font-weight:700; font-size:1.02rem; margin:0;}
  .mcard p{font-size:0.82rem; color:var(--grey); margin:0; line-height:1.45;}
  .mcard-play{margin-top:auto; display:flex; align-items:center; gap:7px; font-size:0.78rem; font-weight:700; color:var(--accent);}
  .mcard-play svg{width:13px; height:13px;}

  /* ---------- Visionneuse capsules (story) ---------- */
  .story-overlay{position:fixed; inset:0; background:rgba(10,13,15,0.92); z-index:100; display:none; align-items:center; justify-content:center;}
  .story-overlay.open{display:flex;}
  .story-frame{
    position:relative; width:min(94vw,380px); height:min(84vh,720px);
    background:linear-gradient(160deg,var(--panel-2),var(--panel)); border-radius:22px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .story-bars{display:flex; gap:5px; padding:12px 14px 0;}
  .story-bar{flex:1; height:3px; background:rgba(255,255,255,0.18); border-radius:3px; overflow:hidden;}
  .story-bar i{display:block; height:100%; width:0%; background:var(--accent);}
  .story-bar.done i{width:100%;}
  .story-top{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0;}
  .story-mod-title{font-size:0.78rem; font-weight:700; color:var(--grey);}
  .story-close{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center;}
  .story-close svg{width:14px; height:14px;}
  .story-tapzones{position:absolute; inset:0; top:52px; display:flex; z-index:2;}
  .story-tapzones div{flex:1;}
  .story-body{flex-grow:1; display:flex; align-items:center; justify-content:center; padding:26px 26px 30px; text-align:center; position:relative;}
  .capsule{display:none; flex-direction:column; align-items:center; gap:14px; animation:capsuleIn 0.35s ease;}
  .capsule.active{display:flex;}
  @keyframes capsuleIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .cap-label{font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent);}
  .cap-label.warn{color:var(--warn);}
  .cap-icon{width:56px; height:56px;}
  .cap-title{font-family:'Anton',sans-serif; font-size:1.5rem; text-transform:uppercase; line-height:1.15;}
  .cap-hook{color:var(--grey); font-size:0.9rem; line-height:1.5; max-width:280px;}
  .cap-text{font-size:1.2rem; line-height:1.5; font-weight:500; max-width:290px;}
  .cap-number{font-family:'Anton',sans-serif; font-size:2.6rem; color:var(--accent); line-height:1;}
  .cap-number-label{font-size:0.85rem; color:var(--grey);}
  .cap-warn{font-size:1.1rem; line-height:1.5; color:#FFD9C7; max-width:280px;}

  .story-nav{display:flex; gap:10px; padding:0 20px 20px;}
  .story-btn{flex:1; padding:12px; border-radius:100px; font-weight:700; font-size:0.85rem; text-align:center;}
  .story-btn.prev{background:rgba(255,255,255,0.08); color:var(--ink);}
  .story-btn.next{background:var(--accent); color:var(--bg);}
  .story-btn[disabled]{opacity:0.3; pointer-events:none;}

  @media (max-width:480px){ .story-frame{border-radius:0; width:100vw; height:100vh;} }

  /* ---------- RTL adjustments ---------- */
  html[dir="rtl"] body{font-family:'Cairo', 'Poppins', sans-serif;}
  html[dir="rtl"] h1, html[dir="rtl"] .cap-title{font-family:'Cairo', 'Anton', sans-serif; text-transform:none;}
  html[dir="rtl"] .kicker, html[dir="rtl"] .cap-label{font-family:'Cairo', 'IBM Plex Mono', sans-serif;}
  html[dir="rtl"] .nav-actions a svg{transform:scaleX(-1);}
</style>
</head>
<body>

<header>
  <div class="container top-row">
    <div class="brand">
      <img src="../../LOGO_MARQUE.png" alt="4Cake">

</header>

<section class="hero">
  <div class="container">

  </div>
</section>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<div class="story-overlay" id="storyOverlay">
  <div class="story-frame">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-top">
      <span class="story-mod-title" id="storyModTitle"></span>
      <button class="story-close" onclick="closeStory()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="story-body" id="storyBody">

      <button class="story-btn next" id="btnNext" onclick="nextCap()">Suivant</button>

  </div>
</div>

let currentLang = localStorage.getItem('4cake_lang') || 'fr';

function m(mod){ return mod[currentLang]; }

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = MODULES.map((mod,i) => {
    const d = m(mod);
    return `
    <div class="mcard" onclick="openStory('${mod.id}')">
      <div class="mcard-top">
        <span class="mcard-num mono">0${i+1}</span>
        <div class="mcard-dots">${d.capsules.map(()=>'<span></span>').join('')}</div>
      </div>
      ${ICONS[mod.icon]}
      <h3>${d.title}</h3>
      <p>${d.hook}</p>
      <div class="mcard-play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
        ${UI[currentLang].voir_capsule}
      </div>
    </div>
  `;}).join('');
}

let curModule = null, curCap = 0, timer = null;
const CAP_DURATION = 4200;

function openStory(id){
  curModule = MODULES.find(mod => mod.id === id);
  curCap = 0;
  const d = m(curModule);
  document.getElementById('storyModTitle').textContent = d.title;
  document.getElementById('storyBars').innerHTML = d.capsules.map(() => `<div class="story-bar"><i></i></div>`).join('');
  const body = document.getElementById('storyBody');
  body.querySelectorAll('.capsule').forEach(c => c.remove());
  d.capsules.forEach((c, idx) => body.insertAdjacentHTML('beforeend', capsuleHTML(c, idx)));
  document.getElementById('storyOverlay').classList.add('open');
  renderCap(true);
}
function capsuleHTML(c, idx){
  const t = UI[currentLang];
  if(c.type === 'title') return `<div class="capsule" data-i="${idx}">
      <div class="cap-title">${c.title}</div><div class="cap-hook">${c.hook}</div></div>`;
  if(c.type === 'text') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">${c.label}</div><div class="cap-text">${c.text}</div></div>`;
  if(c.type === 'number') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label">${t.chiffre_cle}</div><div class="cap-number">${c.value}</div><div class="cap-number-label">${c.label}</div></div>`;
  if(c.type === 'warn') return `<div class="capsule" data-i="${idx}">
      <div class="cap-label warn">${t.a_eviter}</div><div class="cap-warn">${c.text}</div></div>`;
  return '';
}
function renderCap(){
  const caps = document.querySelectorAll('.capsule');
  const bars = document.querySelectorAll('.story-bar');
  caps.forEach((c,i) => c.classList.toggle('active', i === curCap));
  bars.forEach((b,i) => {
    b.classList.toggle('done', i < curCap);
    const bar = b.querySelector('i');
    if(i < curCap){ bar.style.transition='none'; bar.style.width='100%'; }
    else if(i === curCap){ bar.style.transition='none'; bar.style.width='0%'; requestAnimationFrame(()=>{ bar.style.transition=`width ${CAP_DURATION}ms linear`; bar.style.width='100%'; }); }
    else { bar.style.transition='none'; bar.style.width='0%'; }
  });
  document.getElementById('btnPrev').disabled = curCap === 0;
  document.getElementById('btnNext').textContent = curCap === m(curModule).capsules.length - 1 ? UI[currentLang].btn_termine : UI[currentLang].btn_suivant;
  clearTimeout(timer);
  timer = setTimeout(() => { if(curCap < m(curModule).capsules.length - 1) nextCap(); }, CAP_DURATION);
}
function nextCap(){
  if(curCap < m(curModule).capsules.length - 1){ curCap++; renderCap(); }
  else { closeStory(); }
}
function prevCap(){
  if(curCap > 0){ curCap--; renderCap(); }
}
function closeStory(){
  clearTimeout(timer);
  document.getElementById('storyOverlay').classList.remove('open');
}
document.getElementById('storyOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'storyOverlay') closeStory();
});

function applyStaticTranslations(lang){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(UI[lang][key] !== undefined){
      el.textContent = UI[lang][key];
    }
  });
}

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('4cake_lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('lang-ar').classList.toggle('active', lang === 'ar');
  applyStaticTranslations(lang);
  renderGrid();
}

setLang(currentLang);
</script>
