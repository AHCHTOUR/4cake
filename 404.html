<style>
  :root{--or:#D4A017; --brun:#3A2E1A; --creme:#FBF6E9; --gris:#6B5E4E;}
  *{margin:0; padding:0; box-sizing:border-box;}
  body{font-family:'Poppins',sans-serif; background:var(--creme); color:var(--brun);

  p{color:var(--gris); font-size:0.95rem; line-height:1.65; margin-bottom:28px;}
  .links{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .links a{padding:12px 22px; border-radius:100px; font-weight:700; font-size:0.87rem; text-decoration:none;}
  .primary{background:var(--or); color:#fff;}
  .primary:hover{filter:brightness(1.08);}
  .ghost{background:#fff; color:var(--brun); border:1.5px solid rgba(58,46,26,.15);}
  .ghost:hover{border-color:var(--or);}
  .contact{margin-top:30px; font-size:0.84rem; color:var(--gris);}
  .contact a{color:var(--or); font-weight:600; text-decoration:none;}
  @media(max-width:480px){ .code{font-size:3.4rem;} h1{font-size:1.2rem;} }

</head>
