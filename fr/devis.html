<style>
:root{--dore:#D4A017;--brun:#3A2E1A;--creme:#FBF6E9;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--creme);color:var(--brun);line-height:1.7;}
header{background:var(--brun);padding:14px 20px;}
header a{color:var(--dore);text-decoration:none;font-weight:700;font-size:0.95rem;}
main{max-width:600px;margin:0 auto;padding:32px 20px 60px;}
h1{font-size:1.4rem;margin:0 0 4px;}
.ref{color:#6B5E4E;font-size:0.9rem;margin-bottom:24px;}
.card{background:#fff;border:1px solid #E9DCC0;border-radius:14px;padding:20px;margin-bottom:16px;}
.card h2{font-size:0.95rem;color:var(--brun);border-bottom:2px solid var(--dore);padding-bottom:6px;margin:0 0 12px;}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E9DCC0;font-size:0.92rem;}
.row:last-child{border-bottom:none;}
.row span:first-child{color:#6B5E4E;}
.total{font-size:1.1rem;font-weight:700;color:var(--brun);text-align:right;margin-top:8px;}
.status{display:inline-block;background:var(--dore);color:#fff;font-size:0.8rem;font-weight:700;padding:4px 12px;border-radius:100px;}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--brun);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:100px;}
.cta-pdf{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--dore);color:#fff;border:none;cursor:pointer;font-weight:700;font-size:1rem;padding:13px 22px;border-radius:100px;font-family:inherit;}
.loading, .error{text-align:center;padding:60px 20px;color:#6B5E4E;}
footer{text-align:center;padding:24px;font-size:0.85rem;color:#6B5E4E;}
</style>

function generateQuotePDF(data){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const marginX = 48;
  let y = 56;

  doc.setFillColor(62, 42, 30);
  doc.rect(0, 0, pageWidth, 100, 'F');
  try{ doc.addImage(LOGO_DATA_URI, 'PNG', marginX, 16, 62, 62); }catch(err){ console.error('Logo PDF non chargé', err); }

  doc.setTextColor(255,255,255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('4Cake', marginX + 74, 40);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('Fournisseur grossiste — ingrédients & fournitures pâtisserie', marginX + 74, 58);
  doc.text('www.4cake.ma', marginX + 74, 72);

  doc.setTextColor(201, 122, 61);
  doc.setFontSize(24);
  doc.setFont('helvetica', 'bold');
  doc.text('DEVIS', pageWidth - marginX, 42, { align: 'right' });
  doc.setTextColor(255,255,255);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('N° ' + data.ref, pageWidth - marginX, 62, { align: 'right' });
  doc.text(data.dateStr, pageWidth - marginX, 76, { align: 'right' });

  y = 130;
  doc.setTextColor(62, 42, 30);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('Informations client', marginX, y);
  y += 18;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  const infoLines = [
    ['Société / Raison sociale', data.company || '—'],
    ['Contact', data.name || '—'],
    ['Téléphone', data.phone || '—'],
    ['Ville', data.city || '—'],
    ['Fréquence de commande', data.freq || '—'],
  ];
  infoLines.forEach(([label, val]) => {
    doc.setFont('helvetica', 'bold');
    doc.text(label + ' :', marginX, y);
    doc.setFont('helvetica', 'normal');
    doc.text(String(val), marginX + 160, y);
    y += 16;
  });

  y += 12;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Sélection de produits', marginX, y);
  y += 10;

  y += 12;
  doc.setFillColor(247, 233, 221);
  doc.rect(marginX, y - 12, pageWidth - marginX*2, 20, 'F');
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.text('Produit', marginX + 6, y + 2);
  doc.text('Qté', pageWidth - marginX - 190, y + 2);
  doc.text('Prix unit.', pageWidth - marginX - 130, y + 2);
  doc.text('Total (MAD)', pageWidth - marginX - 10, y + 2, { align: 'right' });
  y += 20;

  doc.setFont('helvetica', 'normal');
  (data.lines || []).forEach((line, i) => {
    if(y > 740){ doc.addPage(); y = 56; }
    if(i % 2 === 1){
      doc.setFillColor(252, 247, 240);
      doc.rect(marginX, y - 12, pageWidth - marginX*2, 18, 'F');
    }
    doc.setTextColor(62,42,30);
    doc.text(line.name, marginX + 6, y);
    doc.text(String(line.qty), pageWidth - marginX - 190, y);
    doc.text((line.unitPrice || '') + ' ' + (line.unit || ''), pageWidth - marginX - 130, y);
    doc.text(String(line.lineTotal), pageWidth - marginX - 10, y, { align: 'right' });
    y += 18;
  });

  y += 10;
  doc.setDrawColor(62,42,30);
  doc.line(marginX, y, pageWidth - marginX, y);
  y += 22;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(201, 122, 61);
  doc.text('Estimation totale : ' + data.total + ' MAD', pageWidth - marginX, y, { align: 'right' });

  if(data.msg){
    y += 30;
    doc.setFontSize(10);
    doc.setTextColor(62,42,30);
    doc.setFont('helvetica', 'bold');
    doc.text('Message / précisions :', marginX, y);
    y += 15;
    doc.setFont('helvetica', 'normal');
    const split = doc.splitTextToSize(data.msg, pageWidth - marginX*2);
    doc.text(split, marginX, y);
    y += split.length * 13;
  }

  y = 780;
  doc.setFontSize(8);
  doc.setTextColor(140, 120, 105);
  doc.text('Estimation indicative hors remise grossiste — montant final confirmé par notre équipe selon les quantités.', marginX, y);
  doc.text('4Cake — Distribué par SLCM · Document généré automatiquement le ' + data.dateStr, marginX, y + 12);

  doc.save(`devis-4cake-${data.ref}.pdf`);
}

if (!id) {
  content.className = 'error';
  content.innerHTML = 'Aucun identifiant de devis fourni.';
} else {
  fetch('https://script.google.com/macros/s/AKfycbxJr8v042sakD1F2H7GSrd9_lJPboLitSAQjb9zA-I13V8Ys-N7cyliWXHZYHYKAmw/exec?id=' + encodeURIComponent(id))
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        content.className = 'error';
        content.innerHTML = 'Devis introuvable. Vérifiez le lien reçu, ou contactez-nous directement.';
        return;
      }
      quoteData = data;
      let produits = [];
      try { produits = data.produits || []; } catch(e) {}
      const lignesHtml = produits.map(p =>
        `<div class="row"><span>${p.name} × ${p.qty}</span><span>${p.lineTotal} MAD</span></div>`
      ).join('');
      const dateAffichee = data.date ? new Date(data.date).toLocaleDateString('fr-FR', {year:'numeric',month:'long',day:'numeric'}) : '';

      content.className = '';
      content.innerHTML = `
        <h1>Devis ${data.id}</h1>
        <div class="ref">Demandé le ${dateAffichee} — <span class="status">${data.statut || 'Nouveau'}</span></div>
        <div class="card">
          <h2>Vos informations</h2>
          <div class="row"><span>Société</span><span>${data.company || '—'}</span></div>
          <div class="row"><span>Contact</span><span>${data.name || '—'}</span></div>
          <div class="row"><span>Téléphone</span><span>${data.phone || '—'}</span></div>
          <div class="row"><span>Ville</span><span>${data.city || '—'}</span></div>
          <div class="row"><span>Fréquence</span><span>${data.freq || '—'}</span></div>
        </div>
        <div class="card">
          <h2>Produits sélectionnés</h2>
          ${lignesHtml || '<div class="row"><span>Aucun détail produit</span></div>'}
          <div class="total">Total estimé : ${data.total || 0} MAD</div>
        </div>
        ${data.message ? `<div class="card"><h2>Votre message</h2><p>${data.message}</p></div>` : ''}
        <div class="actions">
          <button class="cta-pdf" id="btnPdf">⬇ Télécharger le PDF</button><br>
          <a class="cta" href="https://wa.me/212661759934?text=Bonjour%2C%20je%20vous%20contacte%20au%20sujet%20de%20mon%20devis%20${encodeURIComponent(data.id)}">Nous contacter sur WhatsApp</a>
        </div>
      `;

      document.getElementById('btnPdf').addEventListener('click', function(){
        try {
          generateQuotePDF({
            company: quoteData.company, name: quoteData.name, phone: quoteData.phone,
            city: quoteData.city, freq: quoteData.freq, msg: quoteData.message,
            lines: quoteData.produits, total: quoteData.total,
            ref: quoteData.id, dateStr: dateAffichee
          });
        } catch(err) {
          console.error('Erreur génération PDF', err);
          alert('Le PDF n\'a pas pu être généré. Réessayez dans un instant.');
        }
      });
    })
    .catch(() => {
      content.className = 'error';
      content.innerHTML = 'Impossible de charger ce devis pour le moment. Réessayez dans un instant.';
    });
}
</script>
</body>
</html>
